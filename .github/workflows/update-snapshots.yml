name: Update Visual Snapshots

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run Visual Tests & Update Snapshots
        run: npx playwright test tests/visual/ --update-snapshots
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://www.demoblaze.com' }}
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/**/*.png
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to visual snapshots found."
            exit 0
          fi
          
          git commit -m"chore: update visual test snapshots [skip ci]"
          git push origin HEAD:${{ github.ref }}
